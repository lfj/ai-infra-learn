global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # AutoDL vLLM 指标经 OTel Collector OTLP 接收后，由 prometheus exporter 暴露
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
